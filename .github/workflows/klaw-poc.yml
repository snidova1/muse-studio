# Klaw PoC — full confirmed PoC for two Klaw findings, on a free
# GitHub Actions runner (Docker + more RAM than the small VM).
# Local test instances only (throwaway H2 DBs, throwaway test passwords).
# Nothing is submitted to Bugcrowd, disclosed, or contacted.
#
# Target: Aiven-Open/klaw @ 574ceed2aa5a3d45a5cf000c71088cb42c362b93
# Candidate 1: default Jasypt key kw2021secretkey decrypts legacy passwords.
# Candidate 2: metadata import into a fresh instance resets all imported
#   users (incl. the superadmin-role account) to WelcomeToKlaw!!.
#
# The workflow reports back into this repo (results files + issue) because
# this runner is the only channel: see the "Report results" step.
name: Klaw PoC

on:
  push:
    paths:
      - '.github/workflows/klaw-poc.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  klaw-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout muse-studio
        uses: actions/checkout@v4

      - name: Checkout Klaw 574ceed
        uses: actions/checkout@v4
        with:
          repository: Aiven-Open/klaw
          ref: 574ceed2aa5a3d45a5cf000c71088cb42c362b93
          path: klaw

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          java-version: '20'
          distribution: temurin
          cache: maven

      - name: Download H2 + Jasypt jars, compile PoC helper
        run: |
          mkdir -p poc-work/tools
          cd poc-work/tools
          curl -fsSL -o h2-2.1.214.jar https://repo1.maven.org/maven2/com/h2database/h2/2.1.214/h2-2.1.214.jar
          curl -fsSL -o jasypt-1.9.3.jar https://repo1.maven.org/maven2/org/jasypt/jasypt/1.9.3/jasypt-1.9.3.jar
          curl -fsSL -o slf4j-api-1.7.36.jar https://repo1.maven.org/maven2/org/slf4j/slf4j-api/1.7.36/slf4j-api-1.7.36.jar
          javac -cp jasypt-1.9.3.jar -d . ../../klaw-poc/JasyptPoc.java
          python3 -m pip install -q pycryptodome
          ls -la

      - name: Build klaw-core (skip tests, no Coral UI)
        run: |
          set +e
          cd klaw
          mvn -B -DskipTests -pl core -am clean > ../poc-work/build.log 2>&1
          echo "mvn clean exit: $?" | tee -a ../poc-work/build.log
          mkdir -p coral/dist/assets/coral
          echo '<html></html>' > coral/dist/index.html
          mvn -B -DskipTests -Dmaven.javadoc.skip=true -pl core -am package >> ../poc-work/build.log 2>&1
          BUILD_RC=$?
          echo "mvn package exit: $BUILD_RC" | tee -a ../poc-work/build.log
          tail -25 ../poc-work/build.log
          ls -la core/target/*.jar
          exit $BUILD_RC

      - name: Run Klaw PoC
        run: bash klaw-poc/run-poc.sh

      - name: Report results back to repo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p poc-work
          if [ ! -f poc-work/poc-summary.md ]; then
            {
              echo "# Klaw PoC results (GitHub Actions, run $GITHUB_RUN_ID)"
              echo ""
              echo "PoC did not produce a summary — it failed before or during the run."
              echo "See poc-results.log / build.log for what happened."
            } > poc-work/poc-summary.md
          fi
          git config user.name "muse-poc"
          git config user.email "muse-poc@users.noreply.github.com"
          git add poc-work/poc-results.log poc-work/poc-summary.md poc-work/build.log poc-work/instance-a.log poc-work/instance-b.log 2>/dev/null
          git status --short
          if ! git diff --cached --quiet; then
            git commit -m "Klaw PoC results $(date -u +%Y-%m-%dT%H:%M:%SZ) [run $GITHUB_RUN_ID]"
            git push
          fi
          gh issue create --title "Klaw PoC results 2026-11-13 (run $GITHUB_RUN_ID)" --body-file poc-work/poc-summary.md || true
